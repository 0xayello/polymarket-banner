<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Polymarket Markets Banner</title>
<style>
html,body{margin:0;padding:0;background:#0d0d0d;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;}
:root{--destructive:#ef4444;--destructive-bg:rgba(239,68,68,0.2);--success:#22c55e;--success-bg:rgba(34,197,94,0.2);--primary:#22c55e;--border:#374151;--text:#f3f4f6;--text-muted:#9ca3af;--bg-gray:#374151;--scroll-duration:160s;}
#banner{position:fixed;inset:0;display:flex;align-items:center;overflow:hidden;background:#0d0d0d;}
.track{display:flex;align-items:center;white-space:nowrap;animation:scroll var(--scroll-duration) linear infinite;will-change:transform;padding:10px 0 10px 0;}
.polymarket-logo{display:inline-flex;align-items:center;gap:8px;padding:0 16px;flex-shrink:0;color:var(--text);font-weight:600;font-size:14px;text-decoration:none;transition:opacity .2s;}
.polymarket-logo:hover{opacity:0.9;}
.polymarket-logo-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:18px;line-height:1;}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
#banner:hover .track{animation-play-state:paused;}
.card{display:inline-flex;align-items:center;gap:12px;padding:0 16px;border-right:1px solid var(--border);text-decoration:none;transition:opacity .2s;flex-shrink:0;}
.card:hover{opacity:0.9;}
.icon{width:32px;height:32px;border-radius:6px;overflow:hidden;flex-shrink:0;background:var(--bg-gray);display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:18px;font-weight:bold;line-height:1;}
.icon img{width:100%;height:100%;object-fit:cover;}
.content{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;flex:1;}
.category{color:var(--text-muted);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:350px;line-height:1.2;}
.title{color:var(--text);font-size:14px;font-weight:400;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:350px;transition:color .2s;}
.card:hover .title{color:var(--primary);}
.badge{display:flex;align-items:baseline;gap:6px;padding:4px 12px;border-radius:6px;flex-shrink:0;}
.badge-low{background:var(--destructive-bg);color:var(--destructive);}
.badge-high{background:var(--success-bg);color:var(--success);}
.badge-percent{font-weight:700;font-size:14px;line-height:1;}
.badge-label{font-size:12px;opacity:0.8;font-weight:500;line-height:1;}
</style>
</head>
<body>
<div id="banner"><div class="track" id="track"></div></div>
<script>
const API_URL="https://poly-proxy.henriqueparadigma.workers.dev/markets?limit=300&closed=false&order_by=volume&order_direction=desc";
const KEYWORDS={
  cripto:["crypto","bitcoin","btc","eth","ethereum","solana","xrp","monad","stable","lighter","megaeth","token","blockchain","defi","nft","coinbase","binance","dogecoin","doge","cardano","ripple","altcoin","web3","litecoin","chainlink","uniswap","aave","tether","usdc","stablecoin","memecoin","layer 2"],
  tech:["tech","ai","nvidia","apple","microsoft","google","alphabet","meta","amazon","tesla","openai","chatgpt","gpt","gemini","anthropic","semiconductor","chip","spacex","tiktok","robot","quantum","computing","autonomous","self-driving","starlink","deepseek","llm"],
  world:["world war","iran","russia","ukraine","china","israel","taiwan","nato","ceasefire","invasion","nuclear","sanctions","gaza","palestine","hamas","hezbollah","north korea","syria","lebanon","venezuela","netanyahu","zelensky","putin","xi jinping","military","troops","missile","attack","peace deal","peace treaty","regime"],
  economy:["economy","inflation","gdp","recession","fed rate","interest rate","federal reserve","stock market","s&p 500","nasdaq","dow jones","tariff","trade war","debt ceiling","jobs report","crude oil","commodity","gold price","real estate","housing market","market cap","earnings report","layoff","treasury","bond yield","forex","dollar index","oil price"],
  trump:["trump","maga","mar-a-lago","melania","ivanka","executive order","pardon"],
  politics:["election","senate","congress","governor","democrat","republican","nomination","presidential","vote","supreme court","scotus","legislation","impeach","resign","cabinet","veto","parliament","prime minister"],
  sports:["nba","nfl","mlb","nhl","fifa","world cup","champions league","premier league","super bowl","stanley cup","playoffs","nba finals","ufc","boxing","wimbledon","formula 1","f1","olympics","medal","qualify for","golden knights","oilers","senators","panthers","hurricanes","stars","rangers","bruins"],
  entertainment:["oscar","grammy","emmy","movie","album","gta","netflix","disney","spotify","concert","tour","celebrity","rihanna","drake","taylor swift","beyonce"]
};
const CAT_NAMES={cripto:"CRYPTO",tech:"TECH",world:"WORLD",economy:"ECONOMY",trump:"TRUMP",politics:"POLITICS",sports:"SPORTS",entertainment:"ENTERTAINMENT"};
const CATS=Object.keys(KEYWORDS);
const pct=v=>Math.max(1,Math.round(parseFloat(v||0)*100));
function detectCat(text){
  const lower=text.toLowerCase();
  for(const c of CATS){
    for(const k of KEYWORDS[c]){
      const kl=k.toLowerCase();
      const match=(kl.includes(' ')||kl.length>5)
        ?lower.includes(kl)
        :new RegExp('\\b'+kl+'\\b').test(lower);
      if(match) return c;
    }
  }
  return null;
}
function getIcon(market){
  const q=(market.question||"").toLowerCase();
  if(/bitcoin|btc/i.test(q)) return '₿';
  if(/ethereum|eth/i.test(q)) return 'Ξ';
  if(/solana|sol/i.test(q)) return '◎';
  if(/xrp/i.test(q)) return 'X';
  if(/monad/i.test(q)) return 'M';
  return '●';
}
const makeCard=d=>{
  const badgeClass=d.p1>=50?'badge-high':'badge-low';
  const catName=CAT_NAMES[d.cat]||d.cat.toUpperCase();
  const fallbackIcon=getIcon({question:d.question||d.title});
  const iconHtml=d.image?`<img src="${d.image}" alt="" onerror="this.onerror=null;this.style.display='none';this.nextElementSibling.style.display='flex'"><span style="display:none">${fallbackIcon}</span>`:`<span>${fallbackIcon}</span>`;
  return `<a href="https://polymarket.com" target="_blank" rel="noopener noreferrer" class="card">
    <div class="icon">${iconHtml}</div>
    <div class="content">
      <div class="category">${catName}</div>
      <div class="title">${d.title}</div>
    </div>
    <div class="badge ${badgeClass}">
      <span class="badge-percent">${d.p1}%</span>
      <span class="badge-label">chance</span>
    </div>
  </a>`;
};

async function loadMarkets(){
  const res=await fetch(API_URL);
  if(!res.ok) throw new Error(res.status);
  const raw=await res.json();
  if(!raw.length) throw new Error('No markets returned');
  return raw.map(m=>{try{const text=(m.question||"")+" "+(m.slug||"");const cat=detectCat(text);if(!cat) return null;const outs=Array.isArray(m.outcomes)?m.outcomes:JSON.parse(m.outcomes);const prices=Array.isArray(m.outcomePrices)?m.outcomePrices:JSON.parse(m.outcomePrices);if(outs.length<2||prices.length<2) return null;return{cat,title:(m.question||m.slug.replace(/-/g," ")).trim(),question:m.question,image:m.icon||m.image||null,p1:pct(prices[0]),p2:pct(prices[1])};}catch{return null;}}).filter(Boolean);
}
function balance(list,maxItems=80){
  const buckets=Object.fromEntries(CATS.map(k=>[k,[]]));
  list.forEach(x=>{if(buckets[x.cat]) buckets[x.cat].push(x);});
  const active=CATS.filter(k=>buckets[k].length);
  if(!active.length) return [];
  const ordered=[];
  // Round-robin across categories that have markets; does not zero out when any category is empty.
  while(ordered.length<maxItems && active.some(k=>buckets[k].length)){
    for(const k of active){
      const item=buckets[k].shift();
      if(item) ordered.push(item);
      if(ordered.length>=maxItems) break;
    }
  }
  return ordered;
}
async function build(){
  const banner=document.getElementById('banner');
  try{
    let markets=await loadMarkets();
    if(!markets.length){
      // Try cache if API returned nothing
      const cached=localStorage.getItem('polymarket_cache_en');
      if(cached){markets=JSON.parse(cached);console.warn('[Banner] Empty API, using cache');}
      else{banner.innerHTML='<div style="color:#ef4444;font-weight:600;padding:20px;text-align:center">⚠️ No markets available right now.</div>';return;}
    }
    markets=balance(markets);
    // Save to cache for fallback
    try{localStorage.setItem('polymarket_cache_en',JSON.stringify(markets));}catch{}
    // Diagnostic log
    const catCount={};markets.forEach(m=>{catCount[m.cat]=(catCount[m.cat]||0)+1;});
    console.log(`[Banner] ${markets.length} markets:`,catCount);
    // Dynamic scroll: ~2s per card
    const duration=Math.max(30,markets.length*2);
    document.documentElement.style.setProperty('--scroll-duration',duration+'s');
    const polymarketLogo='<a href="https://polymarket.com" target="_blank" rel="noopener noreferrer" class="polymarket-logo"><div class="polymarket-logo-icon">P</div><span>Polymarket</span></a>';
    document.getElementById('track').innerHTML=polymarketLogo+[...markets,...markets].map(makeCard).join('');
  }catch(e){
    console.error('Polymarket fetch error',e);
    // Try cache on error
    const cached=localStorage.getItem('polymarket_cache_en');
    if(cached){
      try{
        const markets=JSON.parse(cached);
        console.warn('[Banner] API error, using cache with',markets.length,'markets');
        const duration=Math.max(30,markets.length*2);
        document.documentElement.style.setProperty('--scroll-duration',duration+'s');
        const polymarketLogo='<a href="https://polymarket.com" target="_blank" rel="noopener noreferrer" class="polymarket-logo"><div class="polymarket-logo-icon">P</div><span>Polymarket</span></a>';
        document.getElementById('track').innerHTML=polymarketLogo+[...markets,...markets].map(makeCard).join('');
        return;
      }catch{}
    }
    banner.innerHTML='<div style="color:#ef4444;font-weight:600;padding:20px;text-align:center">⚠️ Could not load markets right now.</div>';
  }
}
build();setInterval(build,10*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(build,1000);});
</script>
</body>
</html>
